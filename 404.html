<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Page introuvable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italianno&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:32px; text-align:center;
    font-family:'Cormorant Garamond',Georgia,serif; color:#24443F;
    background:
      radial-gradient(120% 60% at 50% -10%, #DCEAEE 0%, rgba(220,234,238,0) 60%),
      radial-gradient(90% 50% at 100% 30%, #E3EDE2 0%, rgba(227,237,226,0) 55%),
      radial-gradient(90% 45% at 0% 75%, #E6EFE8 0%, rgba(230,239,232,0) 55%),
      #F6F4ED;
  }
  .box{max-width:440px;display:flex;flex-direction:column;align-items:center;gap:26px}
  .gem{animation:floaty 7s ease-in-out infinite}
  h1{margin:0;font-family:'Italianno',cursive;font-weight:400;font-size:74px;line-height:1.05;color:#24443F}
  h1 span{color:#4E8189}
  .rule{display:flex;align-items:center;gap:16px;width:100%;max-width:280px}
  .rule i{flex:1;height:1px;background:linear-gradient(90deg,rgba(127,168,174,0),#8FB0A2)}
  .rule i+i{background:linear-gradient(270deg,rgba(127,168,174,0),#8FB0A2)}
  .dot{width:7px;height:7px;transform:rotate(45deg);background:#7FA8AE}
  p{margin:0;font-size:19px;font-style:italic;line-height:1.7;color:#3E6B65;text-wrap:pretty}
  small{font-size:15px;letter-spacing:.08em;color:#5B7A74}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
</style>
</head>
<body>
  <div class="box">
    <div class="gem"><svg viewBox="0 0 60 84" width="62" height="86" xmlns="http://www.w3.org/2000/svg" style="display:block"><path d="M30 2 58 30 30 82 2 30Z" fill="#9FC6CC" opacity=".95"/><path d="M30 2 44 30 30 82 16 30Z" fill="#7FA8AE"/><path d="M2 30h56" stroke="#E6F1F2" stroke-width="1.4" fill="none"/><path d="M30 2 16 30M30 2l14 28" stroke="#E6F1F2" stroke-width="1.2" fill="none"/></svg></div>
    <h1>Caroline <span>&amp;</span> Steven</h1>
    <div class="rule"><i></i><span class="dot"></span><i></i></div>
    <p>Cette adresse ne correspond à aucune invitation.<br>Merci d’ouvrir le lien personnel qui vous a été transmis.</p>
    <small>Caroline · 06 10 72 45 88 — Steven · 06 66 07 04 18</small>
  </div>
</body>
</html>
