<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 48px 24px; font-family: 'Cormorant Garamond', Georgia, serif; color: #3F3222; background: radial-gradient(110% 60% at 50% -8%, #FBF8F1 0%, rgba(251,248,241,0) 60%), #F5F0E6; }
  .frame { position: fixed; inset: 12px; border: 1px solid rgba(176,141,87,.55); border-radius: 24px; pointer-events: none; }
  main { display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; max-width: 560px; }
  h1 { margin: 0; font-family: 'Allura', cursive; font-weight: 400; font-size: min(86px, calc((100vw - 48px) / 6.8)); line-height: 1.1; color: #8E6B3A; white-space: nowrap; }
  .divider { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 340px; }
  .divider svg.l { flex: 1; height: 20px; }
  p { margin: 0; font-size: 20px; font-style: italic; line-height: 1.8; color: #5E4C33; text-wrap: pretty; }
  .contacts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 24px; margin-top: 8px; font-size: 17px; letter-spacing: .08em; }
  a { color: #7D5E31; text-decoration: none; border-bottom: 1px solid rgba(176,141,87,.5); padding-bottom: 2px; }
  a:hover { color: #5E4423; }
  @media (max-width: 559px) {
    h1 { white-space: normal; font-size: 68px; line-height: 1; display: flex; flex-direction: column; }
    h1 .amp { font-size: 52px; }
  }
</style>
</head>
<body>
<div class="frame"></div>
<main>
  <svg viewBox="0 0 64 56" width="64" height="56" fill="none" stroke="#A98549" stroke-width="1.1" stroke-linejoin="round" aria-hidden="true">
    <path d="M14 4H50L62 18L32 54L2 18Z"/><path d="M2 18H62M14 4L22 18L32 4L42 18L50 4M22 18L32 54L42 18"/>
  </svg>
  <h1><span>Caroline</span> <span class="amp">&amp;</span> <span>Steven</span></h1>
  <div class="divider" aria-hidden="true">
    <svg class="l" viewBox="0 0 120 20" preserveAspectRatio="none" fill="none"><path d="M2 11C26 3 50 18 76 10S108 6 118 11" stroke="#B08D57" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
    <svg viewBox="0 0 30 30" width="30" height="30" fill="none" stroke="#A98549" stroke-width="1" stroke-linejoin="round"><path d="M15 1V5M8 3L10 6.5M22 3L20 6.5"/><path d="M9 11H21L26 16L15 28L4 16Z"/><path d="M4 16H26M12 11L15 16L18 11M15 16V28"/></svg>
    <svg class="l" viewBox="0 0 120 20" preserveAspectRatio="none" fill="none" style="transform: scaleX(-1)"><path d="M2 11C26 3 50 18 76 10S108 6 118 11" stroke="#B08D57" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
  </div>
  <p>Cette adresse ne correspond à aucune invitation.<br>Merci d’ouvrir le lien personnel qui vous a été transmis.</p>
  <div class="contacts">
    <a href="tel:+33610724588">Caroline · 06 10 72 45 88</a>
    <a href="tel:+33666070418">Steven · 06 66 07 04 18</a>
  </div>
</main>
</body>
</html>
